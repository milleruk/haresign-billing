# Permanent deployment. Secrets are individual read-only files outside git.
#
# **The Traefik router ships disabled.** `BILLING_TRAEFIK_ENABLED` defaults to
# `false`, so bringing this stack up serves nothing publicly — the container
# runs, migrates and can be exercised from inside the host, and
# `billing.haresign.net` resolves to nothing. Enabling it is a deliberate,
# separately authorised cutover step, and it is the *last* one: see
# docs/stripe-cutover.md.
#
# **No Stripe credential is declared here.** There is no `stripe_secret_key`
# secret and no `STRIPE_SECRET_KEY` variable, so this stack cannot reach Stripe
# even by misconfiguration. Adding them is part of the same authorised cutover.

name: haresign_billing

services:
  billing_db:
    container_name: HaresignBillingDB
    environment:
      POSTGRES_DB: haresign_billing
      POSTGRES_USER: haresign_billing
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  billing_redis:
    container_name: HaresignBillingRedis
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - haresign_billing_redisdata:/data

  haresign_billing:
    container_name: HaresignBilling
    # Root only long enough for the entrypoint to read the secret files and drop
    # to uid 10001. Nothing in the application runs privileged.
    user: '0:0'
    image: haresign-billing:${BILLING_IMAGE_TAG:?Set the immutable source-commit image tag}
    env_file:
      - path: /opt/docker/secrets/haresign-billing.env
        required: true
    environment:
      DEBUG: '0'
      SECRET_KEY: null
      SECRET_KEY_FILE: /run/secrets/django_secret
      POSTGRES_DB: haresign_billing
      POSTGRES_USER: haresign_billing
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: billing_db
      POSTGRES_PORT: '5432'
      REDIS_URL: redis://billing_redis:6379/0
      ALLOWED_HOSTS: billing.haresign.net
      SITE_BASE_URL: https://billing.haresign.net
      ENVIRONMENT_LABEL: ''
      # OIDC ships **off**. No production relying-party client exists at Haresign
      # Identity, and creating one is an authorised cutover step. With this unset
      # the sign-in route answers 503 rather than redirecting somewhere that
      # would reject it.
      # Enabling this is a deployment decision, not a code change: the relying
      # party is configured through the protected env file, so the client id and
      # issuer arrive with the deployment that registered them and this file
      # names no environment-specific value.
      OIDC_ENABLED: ${BILLING_OIDC_ENABLED:-0}
      OIDC_ISSUER: ${BILLING_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${BILLING_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: null
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # The organisation-graph projection. HTTPS to Identity's service endpoint
      # and a narrowly scoped rotating credential — there is no database
      # connection to Identity in either direction. Unset closes every sponsored
      # entitlement, which is the correct state for a service holding no graph.
      IDENTITY_GRAPH_URL: ${BILLING_IDENTITY_GRAPH_URL:-}
      IDENTITY_GRAPH_KEY_ID: ${BILLING_IDENTITY_GRAPH_KEY_ID:-}
      IDENTITY_GRAPH_SECRET: null
      IDENTITY_GRAPH_SECRET_FILE: /run/secrets/identity_graph_secret
      # The provider boundary. The fake, in production, deliberately: this stack
      # holds no live subscription and must not be able to reach for one.
      PROVIDER_BACKEND: fake
      BILLING_CHECKOUT_ENABLED: '0'
      ENTITLEMENT_API_KEYS: null
      ENTITLEMENT_API_KEYS_FILE: /run/secrets/entitlement_api_keys
      THROTTLE_FAIL_OPEN: '0'
      TRUSTED_PROXY_COUNT: '1'
      CSP_UPGRADE_INSECURE_REQUESTS: '1'
      SECURE_SSL_REDIRECT: '1'
      SESSION_COOKIE_SECURE: '1'
      CSRF_COOKIE_SECURE: '1'
    secrets:
      - django_secret
      - postgres_password
      - oidc_client_secret
      - entitlement_api_keys
      - identity_graph_secret
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          request = urllib.request.Request(
              'http://127.0.0.1:8000/ready/', headers={'Host': 'billing.haresign.net'}
          )
          sys.exit(0 if urllib.request.urlopen(request, timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      # --- The router ------------------------------------------------------
      # **Disabled.** This is the line that keeps billing.haresign.net unserved,
      # and it stays `false` until the cutover gate in docs/stripe-cutover.md is
      # passed with a human present. Everything below is configured and inert:
      # `traefik.enable=false` makes Traefik ignore the container entirely, so
      # the labels describe a router that is never published.
      traefik.enable: '${BILLING_TRAEFIK_ENABLED:-false}'
      traefik.docker.network: 't3_proxy'

      # Exactly one router serves this hostname. Two would make which middleware
      # chain applies depend on Traefik's internal ordering, which is not a thing
      # to leave to chance on the service that handles money.
      traefik.http.routers.haresign-billing-rtr.rule: 'Host(`billing.haresign.net`)'
      # HTTPS only. HTTP→HTTPS is a global redirection on the `web` entrypoint,
      # so this router is HTTPS-only by construction rather than by its own rule.
      traefik.http.routers.haresign-billing-rtr.entrypoints: 'websecure'
      # No per-router `certresolver`. The existing dns-cloudflare resolver is the
      # default on this entrypoint and already holds the *.haresign.net wildcard,
      # so this hostname needs no new certificate and no ACME request — the same
      # arrangement identity.haresign.net uses.
      traefik.http.routers.haresign-billing-rtr.tls: 'true'
      traefik.http.routers.haresign-billing-rtr.middlewares: >-
        middlewares-rate-limit@file,haresign-billing-headers
      traefik.http.routers.haresign-billing-rtr.service: 'haresign-billing-svc'
      traefik.http.routers.haresign-billing-rtr.priority: '210'
      # Explicit application port. Without it Traefik guesses from exposed ports,
      # and a guess is a thing that changes when a base image does.
      traefik.http.services.haresign-billing-svc.loadbalancer.server.port: '8000'

      # --- Security headers, defined here rather than shared ----------------
      # Deliberately **not** `chain-no-auth@file`. That chain is right for the
      # marketing estate and wrong here in two specific ways:
      #
      #   * it includes `robots-allow`, which sets `X-Robots-Tag: all` — the
      #     exact opposite of this service's "every page is noindex" rule, and it
      #     would override the header Django sets;
      #   * `middlewares-secure-headers` sets `customFrameOptionsValue:
      #     SAMEORIGIN`, which would *weaken* the `DENY` Django sends.
      #
      # A proxy silently downgrading the application's own security headers is
      # worse than no proxy headers at all, because it looks correct in the
      # compose file. So this router gets its own set, matching what Django
      # already sends, and the two agree rather than fight.
      #
      # There is **no Basic Auth**. The preview host has one because it is a
      # preview; this is a production service whose gate is Identity.
      #
      # Nothing here is a secret. Every value is a header constant.
      traefik.http.middlewares.haresign-billing-headers.headers.frameDeny: 'true'
      traefik.http.middlewares.haresign-billing-headers.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.haresign-billing-headers.headers.referrerPolicy: >-
        strict-origin-when-cross-origin
      traefik.http.middlewares.haresign-billing-headers.headers.stsSeconds: '31536000'
      traefik.http.middlewares.haresign-billing-headers.headers.stsIncludeSubdomains: 'true'
      traefik.http.middlewares.haresign-billing-headers.headers.stsPreload: 'true'
      traefik.http.middlewares.haresign-billing-headers.headers.hostsProxyHeaders: >-
        X-Forwarded-Host
      traefik.http.middlewares.haresign-billing-headers.headers.permissionsPolicy: >-
        camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()
      traefik.http.middlewares.haresign-billing-headers.headers.customResponseHeaders.X-Robots-Tag: >-
        noindex, nofollow, noarchive

  billing_backup:
    container_name: HaresignBillingBackup
    build:
      context: .
      dockerfile: backup/Dockerfile
    image: haresign-billing-backup:${BILLING_IMAGE_TAG:?Set the immutable source-commit image tag}
    restart: unless-stopped
    depends_on:
      billing_db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: billing_db
      POSTGRES_DB: haresign_billing
      POSTGRES_USER: haresign_billing
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_RECIPIENT_FILE: /run/secrets/backup_recipient
      BACKUP_INTERVAL_SECONDS: '86400'
      BACKUP_RETENTION_DAYS: '14'
    secrets:
      - postgres_password
      - backup_recipient
    volumes:
      - haresign_billing_backups:/backups
    networks:
      - billing_internal
    healthcheck:
      test: ['CMD-SHELL', "find /backups/.last-success -mmin -1500 -print -quit | grep -q ."]
      interval: 1h
      timeout: 5s
      start_period: 2m
      retries: 2

networks:
  billing_internal:
    # No route out. The application reaches Identity and (after cutover) Stripe
    # over the proxy network; the database and Redis reach nothing at all.
    internal: true

volumes:
  haresign_billing_redisdata:
  haresign_billing_backups:

# One protected directory rather than a scatter of sibling files. The directory
# is mode 700 root:root, so an account that is not root cannot even enumerate
# which secrets this service has, let alone read one; individual files are 600.
secrets:
  django_secret:
    file: /opt/docker/secrets/haresign-billing/django-secret.txt
  postgres_password:
    file: /opt/docker/secrets/haresign-billing/postgres-password.txt
  oidc_client_secret:
    file: /opt/docker/secrets/haresign-billing/oidc-client-secret.txt
  entitlement_api_keys:
    file: /opt/docker/secrets/haresign-billing/entitlement-api-keys.txt
  identity_graph_secret:
    file: /opt/docker/secrets/haresign-billing/identity-graph-secret.txt
  backup_recipient:
    # An `age` **public** key. This host can create a backup and cannot read one;
    # the private half is held separately by whoever may perform a restore.
    file: /opt/docker/secrets/haresign-billing/backup-recipient.txt
